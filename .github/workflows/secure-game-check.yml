name: Secure game static syntax
on:
  push:
    branches: [main, 'security/account-streaming-preview', 'fix/card-loading-controls']
  pull_request:
    paths:
      - 'app-secure.js'
      - 'account-game-entry.test.mjs'
      - 'card-loading.test.mjs'
      - 'secure-game.html'
      - 'secure-purchase.html'
      - 'secure-purchase.test.mjs'
      - 'email-login.js'
      - 'email-login.test.mjs'
      - 'game.html'
      - 'purchase.html'
      - 'index.html'
      - 'offer.html'
      - 'privacy.html'
      - 'release-copy.test.mjs'
      - '.github/workflows/secure-game-check.yml'
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Block accidental publishing of credentials or private decks
        run: |
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split(chr(0))
          banned_dirs = ('private/', 'secrets/', 'credentials/')
          banned_names = ('.env', '.env.production', '.env.local', 'cards.json', 'game-decks.json')
          banned_suffixes = ('.pem', '.key', '.p12', '.pfx', '.sqlite', '.sqlite3', '.db')
          leaked = []
          for path in filter(None, paths):
              base = path.rsplit('/', 1)[-1].lower()
              if path.lower().startswith(banned_dirs) or base in banned_names or base.startswith('.env.') or base.endswith(banned_suffixes):
                  leaked.append(path)
          assert not leaked, 'Sensitive or private files committed to public repository: ' + ', '.join(leaked)
          print('Public file inventory passed.')
          PY
      - run: node --check app-secure.js
      - run: node --test account-game-entry.test.mjs
      - run: node --test card-loading.test.mjs
      - run: node --check email-login.js
      - run: node --test email-login.test.mjs
      - run: node --test secure-purchase.test.mjs
      - run: node --test release-copy.test.mjs
      - name: Check checkout inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inline = []
                  self.active = False
              def handle_starttag(self, tag, attrs):
                  if tag == 'script' and not dict(attrs).get('src'):
                      self.active = True
              def handle_endtag(self, tag):
                  if tag == 'script':
                      self.active = False
              def handle_data(self, data):
                  if self.active:
                      self.inline.append(data)
          parser = Scripts()
          parser.feed(Path('secure-purchase.html').read_text(encoding='utf8'))
          assert parser.inline, 'No inline purchase script found'
          Path('/tmp/vdvoem-secure-purchase.js').write_text('\n'.join(parser.inline))
          PY
          node --check /tmp/vdvoem-secure-purchase.js
      - name: Verify secure game and legacy redirects
        run: |
          grep -q 'app-secure.js?v=7' secure-game.html
          grep -q 'secure-game.html' game.html
          grep -q 'secure-purchase.html' purchase.html
          grep -q 'Authorization' secure-purchase.html
          grep -q 'data-email-auth hidden' secure-game.html
          grep -q 'data-email-auth hidden' secure-purchase.html
          grep -q '/api/auth/providers' email-login.js
          grep -q 'secure-game.html' secure-purchase.html
          ! grep -q 'href="./game.html"' secure-game.html
          ! grep -q 'href="./purchase.html"' secure-game.html
          grep -q "/api/account/card" app-secure.js
          grep -q "/api/account/manifest" app-secure.js
